# Backend

services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: dockerfiles/backend.dockerfile  
    ports:
      - "8000:8000"
    image: pokemonregistry92-fgaceagjgjgqcwfq.azurecr.io/backend:v1

# Frontend

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    image: pokemonregistry92-fgaceagjgjgqcwfq.azurecr.io/frontend:v2
